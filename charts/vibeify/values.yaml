# Default values for vibeify.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
# Global values for the umbrella chart
global:
  clusterName: "vibeify"
  domain: "vibeify.co"

# Rancher subchart values
rancher:
  image:
      repository: docker.io/rancher/rancher
  hostname: "rancher.vibeify.co"   # <- change to your domain (e.g. rancher.vibeify.co)
  replicas: 1

  # TLS / ingress configuration
  ingress:
    tls:
      source: "secret"              # or "letsEncrypt"
      secretName: "tls-rancher"     # if source=secret

  # Bootstrap password for local admin user
  bootstrapPassword: "admin"        # CHANGE THIS

  # Optional: set your own CA / cert manager integration here as needed
  additionalTrustedCAs: false

# Argo CD subchart values
argo-cd:
  global:
    domain: "argocd.vibeify.co"

  # This part is optional once configs.params is set, but harmless:
  server:
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: "traefik"  # or whatever you're actually using
      hosts:
        - "argocd.vibeify.co"
      path: /
      pathType: Prefix
      tls: []  # or your TLS config

  configs:
    params:
      # IMPORTANT: dotted key exactly like this
      server.insecure: "true"

traefik:
  deployment:
    replicas: 1

  ingressClass:
    enabled: true
    isDefaultClass: true
    name: "traefik"

  service:
    type: ClusterIP   # important for tunnel: no cloud LB needed
    spec:
      ports:
        - name: web
          port: 80
          targetPort: 80
        - name: websecure
          port: 443
          targetPort: 443
cloudflare-tunnel:
  image:
    repository: docker.io/cloudflare/cloudflared

  cloudflare:
    account: "6c1c1e976306fb6b61aa438bb63dde50"
    tunnelName: "vibeify-tunnel"
    tunnelId: "f03ad0dd-9a32-42bf-9179-e753603f198f"
    secret: ""
    secretName: "vibeify-tunnel-credentials"
    ingress:

      - hostname: rancher.vibeify.co
        service: http://traefik.cattle-system.svc.cluster.local:80


      - hostname: argocd.vibeify.co
        service: http://vibeify-argocd-server.cattle-system.svc.cluster.local:80

      # - service: http_status:404
