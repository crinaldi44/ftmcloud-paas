# Default values for vibeify.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
# Global values for the umbrella chart
global:
  clusterName: "vibeify"
  domain: "vibeify.co"

# Rancher subchart values
rancher:
  hostname: "rancher.vibeify.co"   # <- change to your domain (e.g. rancher.vibeify.co)
  replicas: 1

  # TLS / ingress configuration
  ingress:
    tls:
      source: "secret"              # or "letsEncrypt"
      secretName: "tls-rancher"     # if source=secret

  # Bootstrap password for local admin user
  bootstrapPassword: "admin"        # CHANGE THIS

  # Optional: set your own CA / cert manager integration here as needed
  additionalTrustedCAs: false

# Argo CD subchart values
argo-cd:
  global:
    domain: "argocd.vibeify.co"    # <- change to your domain (e.g. argocd.vibeify.co)

  server:
    # Service type for Argo CD server
    service:
      type: ClusterIP

    # Enable ingress for Argo CD
    ingress:
      enabled: true
      ingressClassName: "nginx"     # or whatever ingress class you use on OKE
      hosts:
        - "argocd.vibeify.co"      # <- change to your domain
      path: /
      pathType: Prefix
      tls:
        - secretName: "tls-argocd"
          hosts:
            - "argocd.vibeify.com"

  # Example of making Argo CD server not require TLS internally
  configs:
    params:
      server.insecure: "true"
